name: Concorrência (preços do e-commerce)

# Todo dia às 7h (Brasília) compara o preço do top 100 do nosso e-commerce com os sites concorrentes e grava no banco
# (tabela bi_concorrencia com a última coleta e bi_concorrencia_hist com o histórico diário). Nada da empresa é impresso no log nem gravado no repositório.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'coleta (padrão), sonda, concessionarias ou ibge (só para desenvolver)'
        required: false
        default: 'coleta'

permissions:
  contents: read

concurrency:
  group: concorrencia
  cancel-in-progress: false

jobs:
  precos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          pip install "psycopg[binary]==3.2.3"
          if [ "${{ github.event.inputs.modo }}" = "sonda" ] || [ "${{ github.event.inputs.modo }}" = "concessionarias" ]; then pip install playwright && python -m playwright install --with-deps chromium; fi
      - name: Sondar os sites
        if: ${{ github.event.inputs.modo == 'sonda' }}
        run: python etl/concorrencia_probe.py
      - name: Sondar o localizador de concessionárias
        if: ${{ github.event.inputs.modo == 'concessionarias' }}
        run: python etl/concessionarias_osm.py SP RJ MG PR SC RS GO DF MS MT ES BA
      - name: Regiões do IBGE (dado público)
        if: ${{ github.event.inputs.modo == 'ibge' }}
        run: |
          curl -sfL --retry 5 --retry-delay 10 --max-time 120 -o mun.json https://servicodados.ibge.gov.br/api/v1/localidades/estados/35/municipios || true
          if [ ! -s mun.json ]; then
            pip -q install openpyxl
            curl -sfL --retry 3 --max-time 180 -o rg.xlsx "https://geoftp.ibge.gov.br/organizacao_do_territorio/divisao_regional/divisao_regional_do_brasil/divisao_regional_do_brasil_em_regioes_geograficas_2017/tabelas/regioes_geograficas_composicao_por_municipios_2017_20180911.xlsx" || true
            ls -la rg.xlsx || true
            python -c "
          import openpyxl
          for r in openpyxl.load_workbook('rg.xlsx', read_only=True).active.iter_rows(values_only=True):
              if r and str(r[0])[:2] == '35' or (r and len(r)>1 and str(r[1])[:2] == '35'): print('IBGEX|' + '|'.join(str(x) for x in r))
          "
            exit 0
          fi
          cat mun.json | python -c "
          import json,sys
          for m in json.load(sys.stdin):
              ri = m.get('regiao-imediata') or {}; rg = ri.get('regiao-intermediaria') or {}; mi = m.get('microrregiao') or {}
              print('IBGE|%s|%s|%s|%s|%s' % (m['id'], m['nome'], ri.get('nome',''), rg.get('nome',''), mi.get('nome','')))
          "
      - name: Coletar preços
        if: ${{ github.event.inputs.modo != 'sonda' && github.event.inputs.modo != 'concessionarias' && github.event.inputs.modo != 'ibge' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python etl/concorrencia.py
