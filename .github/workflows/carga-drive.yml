name: Carga planilhas -> Supabase

# Confere a pasta do OneDrive corporativo (ou Google Drive) a cada 30 minutos e só recarrega o banco quando
# alguma planilha tiver data de modificação nova. Também pode ser disparado à mão.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Recarregar mesmo sem planilha nova'
        type: boolean
        default: false

concurrency:
  group: carga-drive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verificar configuração
        id: cfg
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_LINK: ${{ secrets.ONEDRIVE_LINK }}
        run: |
          onedrive=false; gdrive=false
          if [ -n "$MS_TENANT_ID" ] && [ -n "$MS_CLIENT_ID" ] && [ -n "$MS_CLIENT_SECRET" ] && [ -n "$ONEDRIVE_LINK" ]; then onedrive=true; fi
          if [ -n "$GDRIVE_FOLDER_ID" ] && [ -n "$GOOGLE_SA_JSON" ]; then gdrive=true; fi
          if [ -z "$SUPABASE_DB_URL" ] || { [ "$onedrive" = false ] && [ "$gdrive" = false ]; }; then
            echo "Segredos da pasta (OneDrive ou Google Drive) e do Supabase ainda não configurados; nada a fazer."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Instalar dependências
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -r etl/requirements.txt

      - name: Carregar planilhas
        if: steps.cfg.outputs.ok == 'true'
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_LINK: ${{ secrets.ONEDRIVE_LINK }}
        run: python etl/carga_drive.py ${{ inputs.forcar && '--forcar' || '' }}
