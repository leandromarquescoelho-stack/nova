name: Carga Google Drive -> Supabase

# Confere a pasta do Drive a cada 30 minutos e só recarrega o banco quando
# alguma planilha tiver data de modificação nova. Também pode ser disparado à mão.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Recarregar mesmo sem planilha nova'
        type: boolean
        default: false

concurrency:
  group: carga-drive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verificar configuração
        id: cfg
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$GDRIVE_FOLDER_ID" ] || [ -z "$GOOGLE_SA_JSON" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "Segredos GDRIVE_FOLDER_ID / GOOGLE_SA_JSON / SUPABASE_DB_URL ainda não configurados; nada a fazer."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Instalar dependências
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -r etl/requirements.txt

      - name: Carregar planilhas
        if: steps.cfg.outputs.ok == 'true'
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python etl/carga_drive.py ${{ inputs.forcar && '--forcar' || '' }}
